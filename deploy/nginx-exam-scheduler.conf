# 门诊检查路线规划 · nginx 站点配置
#
# 放置到 /etc/nginx/conf.d/exam-scheduler.conf，然后：
#   nginx -t && systemctl reload nginx
#
# 443 用自签证书（裸 IP 无法签发受信任证书）。换成域名后可改用 Let's Encrypt：
#   certbot --nginx -d your.domain.com

upstream exam_scheduler_app { server 127.0.0.1:8765; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 8m;

    location / {
        proxy_pass http://exam_scheduler_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    client_max_body_size 8m;

    ssl_certificate     /etc/ssl/exam-scheduler/cert.pem;
    ssl_certificate_key /etc/ssl/exam-scheduler/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://exam_scheduler_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
