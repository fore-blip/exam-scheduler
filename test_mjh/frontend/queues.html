<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实时模拟队列</title>
  <link rel="stylesheet" href="/candidates.css">
  <script src="/queues.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>实时模拟队列</h1>
      <p><a href="/">返回候选集</a></p>

      <p id="call-feedback" role="status"></p>
    </section>
  </main>
</body>
</html>
