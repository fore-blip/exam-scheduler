<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>门诊检查路线规划</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo">✚</div>
      <div>
        <h1>门诊检查路线规划</h1>
        <p id="subtle">正在加载…</p>
      </div>
    </div>
    <nav class="viewtabs" id="viewTabs">
      <button data-view="user" class="on">患者端</button>
      <button data-view="doctor">医生端</button>
    </nav>
  </div>
</header>

<main>
  <!-- ==================== 患者端 ==================== -->
  <section id="viewUser">
    <section class="panel">
      <div class="panel-head">
        <h2>科室候检情况</h2>
        <span class="hint" id="deptHint">正在连接叫号系统…</span>
        <span class="spacer"></span>
        <span class="live" id="live" title="点击暂停 / 继续实时刷新"><i></i><span id="liveText">实时</span></span>
      </div>
      <div class="dept-row" id="depts"></div>
    </section>

    <section class="panel" id="emptyPanel">
      <div class="empty">
        <b>还没有检查单</b>
        <p>请医生在内科完成问诊后开具检查单，这里会自动收到清单并排出路线。</p>
      </div>
    </section>

    <section class="panel" id="rxPanel" style="display:none">
      <div class="panel-head">
        <h2>医生开具的检查</h2>
        <span class="hint" id="rxMeta"></span>
        <span class="spacer"></span>
        <span class="hint">按清单执行，不可自选</span>
      </div>
      <div class="rx-items" id="rxItems"></div>
    </section>

    <section class="panel result" id="result"></section>
  </section>

  <!-- ==================== 医生端 ==================== -->
  <section id="viewDoctor" hidden>
    <section class="panel">
      <div class="panel-head">
        <h2>待诊患者</h2>
        <span class="hint">选择患者后勾选检查项目，点「开具检查单」</span>
        <span class="spacer"></span>
        <button class="btn" id="resetRx">重置演示</button>
      </div>
      <div class="patient-list" id="patients"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>检查项目</h2>
        <span class="hint" id="pickHint">先在上方选择一位患者</span>
        <span class="spacer"></span>
        <span class="hint" id="pickCount">已选 0 项</span>
      </div>
      <div class="exam-grid" id="examPick"></div>
      <div class="actions">
        <button class="btn primary" id="issue" disabled>开具检查单</button>
      </div>
    </section>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
